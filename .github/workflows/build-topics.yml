name: Auto-Build Topics Database

on:
  push:
    paths:
      - 'sitemap*.xml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create build script
        run: |
          cat > build.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          function parseXML(xml) {
              const urls = [];
              const regex = /<loc>(https?:\/\/[^<]+)<\/loc>/g;
              let match;
              while ((match = regex.exec(xml)) !== null) {
                  urls.push(match[1]);
              }
              return urls;
          }

          function formatName(slug) {
              return slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          }

          function extractInfo(url) {
              const clean = url.split('?')[0].split('#')[0].replace(/\/+$/, '');

              let m = clean.match(/\/books\/([^\/]+)\/([^\/]+)\/topics?\/([^\/]+?)(?:\.html)?$/);
              if (!m) {
                  const g = clean.match(/\/books\/([^\/]+)\/([^\/]+)\/([^\/]+?)(?:\.html)?$/);
                  if (g && g[3] !== 'topics' && g[3] !== 'topic') m = g;
              }
              if (!m) return null;

              const bookSlug    = decodeURIComponent(m[1]);
              const chapterSlug = decodeURIComponent(m[2]);
              const topicSlug   = decodeURIComponent(m[3]);

              return {
                  bookSlug: bookSlug,
                  chapterSlug: chapterSlug,
                  topicSlug: topicSlug,
                  bookName: formatName(bookSlug),
                  chapterName: formatName(chapterSlug),
                  topicName: formatName(topicSlug),
                  // Match the URL format used by admin.html / generator.html
                  url: `/books/${bookSlug}/${chapterSlug}/topics/${topicSlug}.html`
              };
          }

          async function fetchSitemap(index) {
              const url = `https://raw.githubusercontent.com/zohaibshamil/bookmcq/main/sitemap${index}.xml`;
              return new Promise((resolve, reject) => {
                  https.get(url, (res) => {
                      if (res.statusCode === 404) {
                          res.resume();
                          return resolve('');
                      }
                      let data = '';
                      res.on('data', chunk => data += chunk);
                      res.on('end', () => resolve(data));
                      res.on('error', reject);
                  }).on('error', reject);
              });
          }

          async function buildTopicsJSON() {
              console.log('📚 Building topics database...');

              let allUrls = [];
              let index = 1;

              while (true) {
                  try {
                      console.log(`  📥 Fetching sitemap${index}.xml...`);
                      const xml = await fetchSitemap(index);

                      if (!xml || !xml.includes('<?xml')) break;

                      const urls = parseXML(xml);
                      const bookUrls = urls.filter(url => url.includes('/books/'));

                      if (bookUrls.length === 0) break;

                      allUrls = allUrls.concat(bookUrls);
                      console.log(`    ✅ Found ${bookUrls.length} URLs (Total: ${allUrls.length})`);
                      index++;
                  } catch (error) {
                      console.log(`    📌 No more sitemaps (stopped at ${index})`);
                      break;
                  }
              }

              console.log(`✅ Total /books/ URLs found: ${allUrls.length}`);

              if (allUrls.length === 0) {
                  console.error('❌ No /books/ URLs found in any sitemap. Refusing to write empty database.');
                  process.exit(1);
              }

              const library = {};
              const bookOrder = [];
              const chapterOrderMap = {};
              const bookSeen = {};
              const chapterSeen = {};
              const topicSet = new Set();

              let unmatchedCount = 0;
              const unmatchedSamples = [];

              for (const url of allUrls) {
                  const info = extractInfo(url);
                  if (!info) {
                      unmatchedCount++;
                      if (unmatchedSamples.length < 15) unmatchedSamples.push(url);
                      continue;
                  }

                  const { bookSlug, chapterSlug, topicSlug, bookName, chapterName, topicName } = info;

                  if (!library[bookSlug]) {
                      library[bookSlug] = { name: bookName, slug: bookSlug, chapters: {} };
                      if (!bookSeen[bookSlug]) {
                          bookSeen[bookSlug] = true;
                          bookOrder.push(bookSlug);
                      }
                  }

                  if (!library[bookSlug].chapters[chapterSlug]) {
                      library[bookSlug].chapters[chapterSlug] = {
                          name: chapterName,
                          slug: chapterSlug,
                          topics: []
                      };
                      if (!chapterSeen[bookSlug + '-' + chapterSlug]) {
                          chapterSeen[bookSlug + '-' + chapterSlug] = true;
                          if (!chapterOrderMap[bookSlug]) chapterOrderMap[bookSlug] = [];
                          chapterOrderMap[bookSlug].push(chapterSlug);
                      }
                  }

                  const topicKey = bookSlug + '|' + chapterSlug + '|' + topicSlug;
                  if (!topicSet.has(topicKey)) {
                      topicSet.add(topicKey);
                      library[bookSlug].chapters[chapterSlug].topics.push({
                          name: topicName,
                          slug: topicSlug,
                          url: info.url
                      });
                  }
              }

              if (unmatchedCount > 0) {
                  console.warn(`⚠️ ${unmatchedCount} of ${allUrls.length} URLs did not match the topic pattern.`);
                  console.warn('   Sample URLs that failed to match:');
                  unmatchedSamples.forEach(u => console.warn(`   - ${u}`));
                  console.warn('   (Book index pages and chapter index pages are expected to be unmatched.)');
              }

              const bookCount = Object.keys(library).length;
              if (bookCount === 0) {
                  console.error('❌ BUILD FAILED: 0 books extracted.');
                  console.error(`   ${allUrls.length} /books/ URLs were found, but none matched the topic pattern.`);
                  console.error('   Check your sitemap URL format (see sample URLs above).');
                  console.error('   Refusing to write/commit an empty topics-data.min.json.');
                  process.exit(1);
              }

              let chapterCount = 0;
              for (const bookKey in library) {
                  chapterCount += Object.keys(library[bookKey].chapters).length;
              }

              const finalData = {
                  version: '2.0',
                  generated: new Date().toISOString(),
                  stats: {
                      bookCount: bookCount,
                      chapterCount: chapterCount,
                      topicCount: topicSet.size
                  },
                  bookOrder: bookOrder,
                  chapterOrderMap: chapterOrderMap,
                  library: library
              };

              const minified = JSON.stringify(finalData);
              fs.writeFileSync('topics-data.min.json', minified);

              console.log('\n✅ BUILD COMPLETE!');
              console.log(`📚 Books: ${finalData.stats.bookCount}`);
              console.log(`📖 Chapters: ${finalData.stats.chapterCount}`);
              console.log(`📝 Topics: ${finalData.stats.topicCount}`);
              console.log(`📁 File size: ${(minified.length / 1024).toFixed(1)} KB`);
          }

          buildTopicsJSON().catch(error => {
              console.error('❌ Build failed:', error);
              process.exit(1);
          });
          EOF

      - name: Run build script
        run: node build.js

      - name: Debug - verify build script has safety check
        run: |
          if grep -q "BUILD FAILED: 0 books extracted" build.js; then
            echo "✅ New build.js present (safety check found)"
          else
            echo "❌ OLD build.js present (safety check MISSING)"
            head -20 build.js
            exit 1
          fi

      - name: Verify output has data
        run: |
          set -e
          BOOKS=$(node -e 'const d=require("./topics-data.min.json");console.log(Object.keys(d.library||{}).length)')
          echo "Books in output: $BOOKS"
          if [ "$BOOKS" = "0" ]; then
            echo "❌ Output has 0 books — refusing to commit"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add topics-data.min.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update topics database [skip ci]"
          git push
