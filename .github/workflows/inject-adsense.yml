name: Inject AdSense Snippet

on:
  # Trigger 1: after pre-render finishes (for books/** changes)
  workflow_run:
    workflows: ["Pre-render Math (Books Only)"]
    types: [completed]
    branches: [main, master]

  # Trigger 2: any HTML change outside books/ (e.g. root .html files)
  push:
    branches: [main, master]
    paths:
      - '**.html'
      - '!books/**'      # books/ is handled by workflow_run to avoid double-run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-adsense:
    # Skip if pre-render workflow failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Only wait when triggered by pre-render (books flow)
      - name: Wait 1 minute for pre-render to settle
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 60

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject AdSense into all HTML files
        run: |
          SNIPPET='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5790863833339632" crossorigin="anonymous"></script>'
          MARKER='ca-pub-5790863833339632'

          find . -type f -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./dist/*" \
            -not -path "./build/*" | while read -r file; do

            if grep -q "$MARKER" "$file"; then
              echo "⏩ Skipping (already present): $file"
              continue
            fi

            if grep -qi "</head>" "$file"; then
              perl -0pi -e "s{</head>}{$SNIPPET\n</head>}i" "$file"
              echo "✅ Injected into: $file"
            else
              echo "⚠️  No </head> found, skipping: $file"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: auto-inject AdSense snippet into HTML files"
            git pull --rebase
            git push
          else
            echo "No changes to commit."
          fi
