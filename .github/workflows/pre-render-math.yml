name: Pre-render Math (Books Only)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'books/**/*.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install dependencies (none needed)
      run: echo "No dependencies to install"
    
    - name: Pre-render math (books only)
      run: node pre-render-math.js
    
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add books/
        git diff --staged --quiet || git commit -m "Pre-render math formulas in books folder"
        git push
