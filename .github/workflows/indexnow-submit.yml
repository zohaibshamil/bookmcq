name: Submit to IndexNow

on:
  push:
    paths:
      - 'sitemap*.xml'
      - '*.html'
  workflow_dispatch:  # Manual trigger from browser

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Submit all sitemap URLs to IndexNow
        run: |
          echo '🚀 Starting IndexNow submission...'
          
          # DYNAMIC: Find ALL sitemap files automatically
          echo '📄 Discovering all sitemap files...'
          SITEMAP_FILES=$(find . -maxdepth 1 -name "sitemap*.xml" -type f | sort -V)
          SITEMAP_COUNT=$(echo "$SITEMAP_FILES" | wc -l)
          
          if [ -z "$SITEMAP_FILES" ] || [ "$SITEMAP_COUNT" -eq 0 ]; then
            echo '⚠️ No sitemap files found, using HTML files...'
            find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" | while read file; do
              url_path=$(echo "$file" | sed 's/^\.\///' | sed 's/\/index.html$//' | sed 's/\.html$//')
              echo "https://www.bookmcq.com/$url_path"
            done > all-urls.txt
          else
            echo "📊 Found $SITEMAP_COUNT sitemap files"
            
            # Process each sitemap dynamically
            echo "$SITEMAP_FILES" | while read sitemap; do
              echo "  📄 Processing: $sitemap"
              grep -o '<loc>[^<]*</loc>' "$sitemap" | sed 's/<loc>//g' | sed 's/<\/loc>//g' >> all-urls.txt
            done
            
            # Replace any github.io URLs with your actual domain
            sed -i 's|https://zohaibshamil.github.io/bookmcq|https://www.bookmcq.com|g' all-urls.txt
          fi
          
          # Remove duplicates and empty lines
          echo '🧹 Cleaning up URLs...'
          sort -u all-urls.txt | grep -v '^$' > unique-urls.txt
          
          TOTAL_UNIQUE=$(wc -l < unique-urls.txt)
          echo "📊 Total unique URLs found: $TOTAL_UNIQUE"
          
          if [ "$TOTAL_UNIQUE" -eq 0 ]; then
            echo '❌ No URLs found to submit'
            exit 1
          fi
          
          # AUTO-CHUNKING: Split into 10,000 URL chunks
          echo '📦 Splitting URLs into chunks of 10,000...'
          split -l 10000 unique-urls.txt chunk_
          CHUNK_COUNT=$(ls chunk_* 2>/dev/null | wc -l)
          echo "📊 Created $CHUNK_COUNT chunk(s)"
          
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          CHUNK_NUM=1
          
          for chunk in chunk_*; do
            echo ""
            echo "📤 Submitting chunk $CHUNK_NUM/$CHUNK_COUNT..."
            
            URL_COUNT=$(wc -l < "$chunk")
            echo "  📊 URLs in this chunk: $URL_COUNT"
            
            # Build JSON payload to a temporary file (FIXES the "Argument list too long" error)
            echo '{"host":"www.bookmcq.com","key":"6bbe7d3e1e8b40dc9dbf374b9de2010b","keyLocation":"https://www.bookmcq.com/6bbe7d3e1e8b40dc9dbf374b9de2010b.txt","urlList":[' > payload.json
            cat "$chunk" | sed 's/^/"/' | sed 's/$/"/' | paste -sd, >> payload.json
            echo ']}' >> payload.json
            
            # Submit using the temporary file
            RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @payload.json)
            
            HTTP_CODE="${RESPONSE: -3}"
            BODY="${RESPONSE%???}"
            
            echo "  HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "  ✅ Chunk $CHUNK_NUM submitted successfully!"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif [ "$HTTP_CODE" == "403" ]; then
              echo "  ❌ Forbidden - Key file not accessible"
              echo "  Make sure: https://www.bookmcq.com/6bbe7d3e1e8b40dc9dbf374b9de2010b.txt is accessible"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            elif [ "$HTTP_CODE" == "422" ]; then
              echo "  ❌ Unprocessable - Check URL formatting"
              echo "  Response: $BODY"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            elif [ "$HTTP_CODE" == "429" ]; then
              echo "  ⏳ Rate limited - Waiting 60 seconds before retry..."
              sleep 60
              echo "  🔄 Retrying chunk $CHUNK_NUM..."
              RESPONSE_RETRY=$(curl -s -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
                -H "Content-Type: application/json; charset=utf-8" \
                -d @payload.json)
              HTTP_CODE_RETRY="${RESPONSE_RETRY: -3}"
              if [ "$HTTP_CODE_RETRY" == "200" ]; then
                echo "  ✅ Chunk $CHUNK_NUM submitted successfully on retry!"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "  ❌ Chunk $CHUNK_NUM failed on retry"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            else
              echo "  ⚠️ Response: $BODY"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
            
            # Clean up temporary file
            rm -f payload.json
            
            CHUNK_NUM=$((CHUNK_NUM + 1))
            
            if [ "$CHUNK_NUM" -le "$CHUNK_COUNT" ]; then
              echo "  ⏳ Waiting 2 seconds before next chunk..."
              sleep 2
            fi
          done
          
          # Clean up chunk files
          rm -f chunk_* 2>/dev/null
          
          # Final Summary
          echo ""
          echo "═══════════════════════════════════════════"
          echo "📊 SUBMISSION SUMMARY"
          echo "═══════════════════════════════════════════"
          echo "📊 Total unique URLs: $TOTAL_UNIQUE"
          echo "📦 Total chunks: $CHUNK_COUNT"
          echo "✅ Successful chunks: $SUCCESS_COUNT"
          echo "❌ Failed chunks: $FAIL_COUNT"
          echo "═══════════════════════════════════════════"
          
          if [ "$FAIL_COUNT" -eq 0 ]; then
            echo "🎉 ALL URLs submitted successfully!"
            exit 0
          else
            echo "⚠️ Some chunks failed. Check the logs above."
            exit 1
          fi
