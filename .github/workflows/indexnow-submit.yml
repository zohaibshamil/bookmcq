name: Submit to IndexNow

on:
  push:
    paths:
      - 'sitemap*.xml'
      - '*.html'
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger from browser

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Submit all sitemap URLs to IndexNow
        run: |
          echo '🚀 Starting IndexNow submission...'
          
          # Get all sitemaps
          for i in {1..10}; do
            if [ -f "sitemap${i}.xml" ]; then
              echo "📄 Processing sitemap${i}.xml..."
              # Extract URLs from sitemap
              grep -o '<loc>[^<]*</loc>' "sitemap${i}.xml" | sed 's/<loc>//g' | sed 's/<\/loc>//g' >> all-urls.txt
            fi
          done
          
          # If no sitemaps found, use HTML files
          if [ ! -f all-urls.txt ] || [ ! -s all-urls.txt ]; then
            echo "📄 No sitemaps found, using HTML files..."
            find . -name "*.html" -not -path "./.git/*" | sed 's/^\.//' | while read file; do
              # Remove ./ from start and handle index.html
              url_path=$(echo "$file" | sed 's/^\.\///' | sed 's/\/index.html$//' | sed 's/\.html$//')
              echo "https://www.bookmcq.com/$url_path"
            done > all-urls.txt
          else
            # Replace any github.io URLs with your actual domain
            sed -i 's|https://zohaibshamil.github.io/bookmcq|https://www.bookmcq.com|g' all-urls.txt
          fi
          
          # Limit to 10,000 URLs (IndexNow limit)
          head -10000 all-urls.txt > urls-limited.txt
          
          # Build JSON payload
          echo '📝 Building JSON payload...'
          URLs=$(cat urls-limited.txt | sed 's/^/"/' | sed 's/$/"/' | paste -sd,)
          JSON="{\"host\":\"www.bookmcq.com\",\"key\":\"6bbe7d3e1e8b40dc9dbf374b9de2010b\",\"keyLocation\":\"https://www.bookmcq.com/6bbe7d3e1e8b40dc9dbf374b9de2010b.txt\",\"urlList\":[$URLs]}"
          
          # Submit to IndexNow
          echo '📤 Submitting to IndexNow...'
          RESPONSE=$(curl -s -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON")
          
          HTTP_CODE="${RESPONSE: -3}"
          BODY="${RESPONSE%???}"
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" == "200" ]; then
            echo '✅ Successfully submitted to IndexNow!'
            echo "URLs submitted: $(wc -l < urls-limited.txt)"
          elif [ "$HTTP_CODE" == "403" ]; then
            echo '❌ Forbidden - Key file not accessible or invalid'
            echo "Make sure: https://www.bookmcq.com/6bbe7d3e1e8b40dc9dbf374b9de2010b.txt is accessible"
          else
            echo "⚠️ Response: $BODY"
          fi
