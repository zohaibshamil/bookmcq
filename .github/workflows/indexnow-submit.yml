name: Submit to IndexNow

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Find all HTML files
        id: find
        run: |
          # Find all HTML files (excluding node_modules, .git, etc.)
          find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            url=$(echo "$file" | sed 's/^\.//' | sed 's/\/index.html$//' | sed 's/\.html$//')
            echo "https://zohaibshamil.github.io/bookmcq$url"
          done | head -10000 > urls.txt
      
      - name: Submit to IndexNow
        run: |
          # Read URLs and create JSON
          URLs=$(cat urls.txt | sed 's/^/"/' | sed 's/$/"/' | paste -sd,)
          JSON="{\"host\":\"zohaibshamil.github.io\",\"key\":\"6bbe7d3e1e8b40dc9dbf374b9de2010b\",\"keyLocation\":\"https://zohaibshamil.github.io/bookmcq/6bbe7d3e1e8b40dc9dbf374b9de2010b.txt\",\"urlList\":[$URLs]}"
          
          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON"
